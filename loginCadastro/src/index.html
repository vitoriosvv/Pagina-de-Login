<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Página de Login InovaTech</title>
</head>

<body>
    <main class="conect-container">
        <div class="descript-content">
            <img src="img/icons/iconTechInova.svg">
            <h1>InovaTech</h1>
            <h2>Login</h2>
            <a href="pages/cadastro.html">
                Não possuo cadastro ainda
            </a>
        </div>
        <div class="form-content">
            <form action="#">
                <div class="user-content">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required placeholder="seuemail@gmail.com">
                </div>
                <div class="pass-content">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                </div>
            </form>
            <button type="submit" id="btnEntrar">Entrar</button>
        </div>
    </main>
</body>

</html>
